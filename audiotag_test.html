    function log(msg) {
      logEl.textContent += msg + "\n";
      console.log(msg);
    }

    let player = document.getElementById("player");

    log("ページ読み込み完了。audio要素の状態: readyState=" + player.readyState);

    player.addEventListener("play", function() { log("イベント: play (再生開始要求)"); });
    player.addEventListener("playing", function() { log("イベント: playing (実際に再生中)"); });
    player.addEventListener("pause", function() { log("イベント: pause"); });
    player.addEventListener("ended", function() { log("イベント: ended (再生終了)"); });
    player.addEventListener("error", function(e) {
      log("イベント: error " + (player.error ? ("code=" + player.error.code) : ""));
    });
    player.addEventListener("volumechange", function() {
      log("volumechange: volume=" + player.volume + ", muted=" + player.muted);
    });

    document.getElementById("playBtn").onclick = function() {
      log("再生ボタン押下。 volume=" + player.volume + ", muted=" + player.muted + ", paused=" + player.paused);
      player.currentTime = 0;
      let p = player.play();
      if (p !== undefined) {
        p.then(function() {
          log("play() 成功(Promise resolved)");
        }).catch(function(err) {
          log("play() 失敗: " + err);
        });
      }
    };
  </script>
</body>
</html>
